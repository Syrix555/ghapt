# ghapt APT 仓库静态站点
# setup.sh --with-nginx 会自动安装此文件:
#   - 干净服务器:原样安装(default_server),用 IP 即可访问
#   - 检测到已有站点占用 default_server:自动去掉该标记安装,需把 server_name 改成专用域名或换端口
# 手动安装:复制到 /etc/nginx/sites-available/ 并软链到 sites-enabled。
# 有域名的话把 server_name 改成域名,再用 certbot 上 HTTPS 更好。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/ghapt/repo;
    autoindex on;

    location ~ /\. { deny all; }
}
