# ghapt 配置文件
# 每个 [project:名字] 是一个要跟踪的 GitHub 项目。
# 用 `ghapt.py assets owner/repo` 查看某个项目的资产文件名,再照着写正则。

[settings]
repo_dir = /srv/ghapt/repo
state_file = /srv/ghapt/state.json
gpg_home = /srv/ghapt/gnupg
suite = stable
component = main
# 仓库声明支持的架构;某个项目没有对应架构的资产就不写它的 asset.<arch>
architectures = amd64 arm64
origin = ghapt
label = ghapt
description = Self-hosted APT repo synced from GitHub releases
maintainer = ghapt <ghapt@localhost>
# 每个包在 pool 里保留几个历史版本(必须 >= 1;想彻底不清理就设一个大数)
keep_versions = 2
# GitHub API token(可选)。匿名限流 60 次/小时,项目多或同步频繁时建议配置;
# 也可以写进 /etc/ghapt/env 作为环境变量 GITHUB_TOKEN=xxx
# token = ghp_xxxxxxxx

# ── 示例 1:release 里直接提供 .deb 的项目,原样收录 ──────────────────
[project:ripgrep]
repo = BurntSushi/ripgrep
type = deb
# 只有 amd64 的 deb;结尾 $ 用来排除旁边的 .deb.sha256
asset.amd64 = ^ripgrep_[0-9][^_]*_amd64\.deb$

# ── 示例 2:release 只有二进制 tarball,自动重打包成 .deb ─────────────
[project:lazygit]
repo = jesseduffield/lazygit
type = binary
description = Simple terminal UI for git commands
asset.amd64 = ^lazygit_[0-9][^_]*_linux_x86_64\.tar\.gz$
asset.arm64 = ^lazygit_[0-9][^_]*_linux_arm64\.tar\.gz$
